apiVersion: v1
kind: Namespace
metadata:
  name: voxtral-demo
---
# Secret is created separately via: kubectl apply -f k8s/secret.yaml
# See k8s/secret.yaml.example for the template
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxtral-demo
  namespace: voxtral-demo
  labels:
    app: voxtral-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voxtral-demo
  template:
    metadata:
      labels:
        app: voxtral-demo
    spec:
      containers:
        - name: agent
          image: your-registry/voxtral-demo:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: LIVEKIT_URL
              value: "wss://your-project.livekit.cloud"
            - name: ANAM_AVATAR_ID
              value: "6cc28442-cccd-42a8-b6e4-24b7210a09c5"
          envFrom:
            - secretRef:
                name: voxtral-demo-secrets
